name: 📈 Update Market Data Daily

on:
  schedule:
    # 每天 UTC 01:00 = 新加坡时间 09:00（亚洲开盘后）
    - cron: '0 1 * * 1-5'
    # 每天 UTC 09:00 = 新加坡时间 17:00（美股开盘前）
    - cron: '0 9 * * 1-5'
  workflow_dispatch:  # 允许手动触发

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          pip install yfinance requests python-dateutil pytz

      - name: 🔄 Run market data update script
        run: python scripts/update_data.py

      - name: 🚀 Commit and push updated HTML
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add index.html data/market_data.json
          git diff --staged --quiet || git commit -m "📊 Auto-update market data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
