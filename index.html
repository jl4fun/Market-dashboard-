<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>初始化中… 市場儀表板</title>
<style>
body{background:#09100f;color:#ddeadd;font-family:'IBM Plex Mono',monospace;
     display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center}
.box{padding:40px}
h1{font-size:24px;color:#d4a847;margin-bottom:16px}
p{color:#607870;font-size:13px;line-height:1.8}
.spin{font-size:32px;animation:spin 2s linear infinite;display:block;margin-bottom:20px}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box">
  <span class="spin">⟳</span>
  <h1>儀表板初始化中</h1>
  <p>請前往 GitHub Actions 手動觸發一次<br>
  <strong style="color:#d4a847">📈 Update Market Data Daily</strong><br><br>
  約 1–2 分鐘後刷新此頁面即可看到完整儀表板。</p>
</div>
</body>
</html>
